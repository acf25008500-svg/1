<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>论小黄有多想小白</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --purple-light: #EDE9FE;
    --purple-mid: #C4B5FD;
    --purple: #A78BFA;
    --purple-deep: #7C3AED;
    --pink: #FBCFE8;
    --pink-mid: #F9A8D4;
    --blue-light: #DBEAFE;
    --blue-mid: #BFDBFE;
    --blue: #93C5FD;
    --white: #FFFFFF;
    --text-dark: #4C1D95;
    --text-mid: #6D28D9;
    --text-soft: #8B5CF6;
    --shadow-purple: rgba(167,139,250,0.25);
    --shadow-blue: rgba(147,197,253,0.3);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: linear-gradient(180deg,
      #B8D4F0 0%,
      #C8DEFF 8%,
      #D8E8FF 15%,
      #E4EDFF 25%,
      #EDE9FE 40%,
      #F3F0FF 55%,
      #F8F5FF 70%,
      #FDF9FF 85%,
      #FFFFFF 100%
    );
    font-family: 'Nunito', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ===== HERO PHOTO SECTION ===== */
  .hero {
    position: relative;
    width: 100%;
    height: 320px;
    overflow: hidden;
  }

  .hero-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 30%;
    display: block;
  }

  .hero-fade {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 160px;
    background: linear-gradient(to bottom,
      transparent 0%,
      rgba(180,210,240,0.3) 30%,
      rgba(184,212,240,0.7) 60%,
      #B8D4F0 100%
    );
  }

  .hero-title-overlay {
    position: absolute;
    bottom: 24px;
    left: 0; right: 0;
    text-align: center;
    z-index: 2;
  }

  .title {
    font-family: 'Pacifico', cursive;
    font-size: 1.55rem;
    color: #3B0764;
    text-shadow:
      0 2px 8px rgba(255,255,255,0.8),
      0 0 30px rgba(196,181,253,0.6);
    line-height: 1.3;
    letter-spacing: 0.5px;
  }

  /* ===== MAIN CONTAINER ===== */
  .container {
    max-width: 440px;
    margin: 0 auto;
    padding: 0 16px 50px;
    position: relative;
    z-index: 1;
  }

  /* ===== 3D WHITE CARD ===== */
  .card {
    background: rgba(255,255,255,0.82);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1.5px solid rgba(255,255,255,0.9);
    border-radius: 24px;
    padding: 18px;
    margin-bottom: 14px;
    box-shadow:
      0 2px 0 rgba(255,255,255,0.9) inset,
      0 8px 32px var(--shadow-purple),
      0 2px 8px rgba(196,181,253,0.2),
      0 1px 0 rgba(255,255,255,1) inset;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.95), transparent);
  }


  /* ===== WEATHER ===== */
  .weather-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 14px;
  }

  .weather-card {
    background: rgba(255,255,255,0.82);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1.5px solid rgba(255,255,255,0.9);
    border-radius: 20px;
    padding: 14px 12px 10px;
    text-align: center;
    box-shadow:
      0 2px 0 rgba(255,255,255,0.9) inset,
      0 6px 24px var(--shadow-purple),
      0 2px 6px rgba(196,181,253,0.15);
    position: relative;
    overflow: hidden;
  }

  .weather-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.95), transparent);
  }

  .weather-city {
    font-size: 0.68rem;
    color: var(--purple);
    font-weight: 700;
    letter-spacing: 0.5px;
    margin-bottom: 2px;
  }

  .weather-place {
    font-size: 0.72rem;
    color: var(--text-soft);
    font-weight: 600;
    margin-bottom: 8px;
  }









  /* ===== TOGETHER TIMER ===== */
  .together-label {
    font-size: 0.75rem;
    color: var(--text-soft);
    font-weight: 700;
    letter-spacing: 1.5px;
    text-align: center;
    margin-bottom: 6px;
    text-transform: uppercase;
  }

  .together-date {
    font-size: 1.05rem;
    color: var(--text-dark);
    font-weight: 800;
    text-align: center;
    margin-bottom: 12px;
  }

  .timer-row {
    display: flex;
    justify-content: center;
    gap: 8px;
  }

  .timer-unit {
    background: rgba(255,255,255,0.95);
    border: 1.5px solid rgba(196,181,253,0.4);
    border-radius: 14px;
    padding: 8px 10px;
    text-align: center;
    min-width: 58px;
    box-shadow:
      0 4px 16px rgba(167,139,250,0.2),
      0 1px 0 rgba(255,255,255,1) inset,
      0 -1px 0 rgba(196,181,253,0.15) inset;
  }

  .timer-num {
    font-size: 1.4rem;
    font-weight: 900;
    color: var(--purple-deep);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  .timer-label {
    font-size: 0.6rem;
    color: var(--purple);
    font-weight: 700;
    margin-top: 2px;
    letter-spacing: 1px;
  }

  /* ===== GAUGE WITH SVG CHARACTER ===== */
  .gauge-section {
    text-align: center;
  }

  .gauge-wrap {
    position: relative;
    width: 210px;
    height: 210px;
    margin: 0 auto 10px;
  }

  .gauge-svg-ring {
    width: 210px;
    height: 210px;
    transform: rotate(-90deg);
  }

  .gauge-track {
    fill: none;
    stroke: rgba(196,181,253,0.2);
    stroke-width: 12;
  }

  .gauge-fill {
    fill: none;
    stroke: url(#gaugeGrad);
    stroke-width: 12;
    stroke-linecap: round;
    stroke-dasharray: 534;
    stroke-dashoffset: 534;
    transition: stroke-dashoffset 0.9s cubic-bezier(0.34,1.56,0.64,1);
    filter: drop-shadow(0 0 6px rgba(167,139,250,0.6));
  }

  /* Character image in center */
  .gauge-character {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .char-img-wrap {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    overflow: hidden;
    background: #ffffff;
    border: 3px solid rgba(255,255,255,0.95);
    box-shadow:
      0 4px 20px rgba(167,139,250,0.4),
      0 2px 0 rgba(255,255,255,0.8) inset;
    animation: charFloat 3s ease-in-out infinite;
    flex-shrink: 0;
  }

  .char-img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
  }

  @keyframes charFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  .gauge-pct {
    font-family: 'Pacifico', cursive;
    font-size: 1.1rem;
    color: var(--purple-deep);
    display: block;
    margin-top: 6px;
    text-shadow: 0 1px 4px rgba(124,58,237,0.2);
  }

  .gauge-status {
    font-size: 0.9rem;
    color: var(--text-mid);
    font-weight: 700;
    min-height: 22px;
  }

  /* ===== HEARTS SECTION ===== */
  .hearts-title {
    font-size: 0.75rem;
    color: var(--text-soft);
    font-weight: 700;
    letter-spacing: 1px;
    text-align: center;
    margin-bottom: 10px;
  }

  .hearts-count-display {
    text-align: center;
    margin-bottom: 10px;
  }

  .hearts-big-num {
    font-family: 'Pacifico', cursive;
    font-size: 2.8rem;
    color: var(--purple-deep);
    line-height: 1;
    text-shadow: 0 2px 12px rgba(124,58,237,0.2);
  }

  .hearts-sub {
    font-size: 0.72rem;
    color: var(--purple);
    margin-top: 2px;
  }

  #heartField {
    min-height: 100px;
    max-height: 180px;
    overflow-y: auto;
    display: flex;
    flex-wrap: wrap;
    gap: 2px;
    justify-content: flex-start;
    padding: 10px;
    background: rgba(237,233,254,0.35);
    border-radius: 16px;
    border: 1.5px dashed rgba(196,181,253,0.5);
    scrollbar-width: thin;
    scrollbar-color: var(--purple-mid) transparent;
  }

  #heartField::-webkit-scrollbar { width: 4px; }
  #heartField::-webkit-scrollbar-thumb { background: var(--purple-mid); border-radius: 4px; }

  .heart-item {
    font-size: 1rem;
    animation: heartPop 0.35s cubic-bezier(0.175,0.885,0.32,1.275) forwards;
    display: inline-block;
  }

  @keyframes heartPop {
    0% { transform: scale(0) rotate(-20deg); opacity: 0; }
    70% { transform: scale(1.3) rotate(5deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }

  /* ===== 3D BUTTONS ===== */
  .btn-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 14px;
  }

  .btn-grid .btn-full { grid-column: 1 / -1; }

  .btn {
    background: rgba(255,255,255,0.9);
    color: var(--text-dark);
    border: 1.5px solid rgba(196,181,253,0.5);
    border-radius: 18px;
    padding: 14px 10px;
    font-family: 'Nunito', sans-serif;
    font-size: 0.82rem;
    font-weight: 800;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow:
      0 6px 0 rgba(196,181,253,0.4),
      0 8px 20px rgba(167,139,250,0.2),
      0 1px 0 rgba(255,255,255,1) inset;
    position: relative;
    overflow: hidden;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    line-height: 1.4;
  }

  .btn::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 50%;
    background: linear-gradient(to bottom, rgba(255,255,255,0.6), transparent);
    border-radius: 18px 18px 0 0;
    pointer-events: none;
  }

  .btn:hover {
    transform: translateY(-2px);
    box-shadow:
      0 8px 0 rgba(196,181,253,0.4),
      0 12px 28px rgba(167,139,250,0.25),
      0 1px 0 rgba(255,255,255,1) inset;
  }

  .btn:active {
    transform: translateY(4px);
    box-shadow:
      0 2px 0 rgba(196,181,253,0.4),
      0 4px 10px rgba(167,139,250,0.15),
      0 1px 0 rgba(255,255,255,1) inset;
  }

  .btn small {
    display: block;
    font-size: 0.68rem;
    color: var(--purple);
    font-weight: 700;
    margin-top: 2px;
  }

  .btn-special {
    background: rgba(237,233,254,0.9);
    border-color: rgba(167,139,250,0.5);
    box-shadow:
      0 6px 0 rgba(167,139,250,0.35),
      0 8px 20px rgba(167,139,250,0.2),
      0 1px 0 rgba(255,255,255,0.9) inset;
  }

  .btn-special:hover {
    box-shadow:
      0 8px 0 rgba(167,139,250,0.4),
      0 12px 28px rgba(167,139,250,0.28),
      0 1px 0 rgba(255,255,255,0.9) inset;
  }
  .btn-special:active {
    box-shadow:
      0 2px 0 rgba(167,139,250,0.35),
      0 4px 10px rgba(167,139,250,0.15),
      0 1px 0 rgba(255,255,255,0.9) inset;
  }

  .btn-clear {
    background: rgba(219,234,254,0.85);
    border-color: rgba(147,197,253,0.5);
    color: #1E40AF;
    box-shadow:
      0 6px 0 rgba(147,197,253,0.4),
      0 8px 20px rgba(147,197,253,0.2),
      0 1px 0 rgba(255,255,255,0.9) inset;
  }

  .btn-clear small { color: #3B82F6; }
  .btn-clear:hover {
    box-shadow:
      0 8px 0 rgba(147,197,253,0.45),
      0 12px 28px rgba(147,197,253,0.28),
      0 1px 0 rgba(255,255,255,0.9) inset;
  }
  .btn-clear:active {
    transform: translateY(4px);
    box-shadow:
      0 2px 0 rgba(147,197,253,0.4),
      0 4px 10px rgba(147,197,253,0.15),
      0 1px 0 rgba(255,255,255,0.9) inset;
  }

  /* ===== LOG ===== */
  .log-title {
    font-size: 0.75rem;
    color: var(--text-soft);
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .log-list {
    list-style: none;
    max-height: 170px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--purple-mid) transparent;
  }

  .log-list::-webkit-scrollbar { width: 4px; }
  .log-list::-webkit-scrollbar-thumb { background: var(--purple-mid); border-radius: 4px; }

  .log-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 0;
    border-bottom: 1px dashed rgba(196,181,253,0.35);
    animation: logSlide 0.3s ease;
  }

  .log-item:last-child { border-bottom: none; }

  @keyframes logSlide {
    from { opacity: 0; transform: translateX(-8px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .log-icon { font-size: 0.95rem; flex-shrink: 0; }
  .log-text { font-size: 0.76rem; color: var(--text-dark); flex: 1; font-weight: 600; }
  .log-time { font-size: 0.65rem; color: var(--purple); flex-shrink: 0; }

  .log-empty {
    text-align: center;
    color: var(--purple-mid);
    font-size: 0.78rem;
    padding: 16px 0;
  }

  /* ===== FLOAT PARTICLES ===== */
  .float-heart {
    position: fixed;
    pointer-events: none;
    z-index: 9999;
    font-size: 1.4rem;
    animation: floatUp 1.4s ease-out forwards;
  }

  @keyframes floatUp {
    0% { transform: translateY(0) scale(1); opacity: 1; }
    100% { transform: translateY(-130px) scale(0.2); opacity: 0; }
  }

  .firework {
    position: fixed;
    pointer-events: none;
    z-index: 9999;
    font-size: 1.8rem;
    animation: fwExplode 1s ease-out forwards;
  }

  @keyframes fwExplode {
    0% { transform: scale(0) rotate(0deg); opacity: 1; }
    50% { transform: scale(1.6) rotate(180deg); opacity: 1; }
    100% { transform: scale(0.3) rotate(360deg); opacity: 0; }
  }

  /* ===== DECORATIONS ===== */
  .deco {
    position: fixed;
    pointer-events: none;
    z-index: 0;
    font-size: 1.3rem;
    animation: floatDeco 7s ease-in-out infinite;
    opacity: 0.25;
  }

  .deco:nth-child(1) { top: 38%; left: 2%; animation-delay: 0s; }
  .deco:nth-child(2) { top: 50%; right: 3%; animation-delay: 1.5s; }
  .deco:nth-child(3) { top: 65%; left: 3%; animation-delay: 3s; }
  .deco:nth-child(4) { top: 75%; right: 2%; animation-delay: 0.8s; }

  @keyframes floatDeco {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-12px) rotate(8deg); }
  }
</style>
</head>
<body>

<div class="deco">💜</div>
<div class="deco">✨</div>
<div class="deco">🎀</div>
<div class="deco">💫</div>

<!-- HERO PHOTO -->
<div class="hero">
  <img class="hero-img" id="heroPhoto" src="" alt="小黄小白">
  <div class="hero-fade"></div>
  <div class="hero-title-overlay">
    <div class="title">🐾 论小黄有多想小白 🐾</div>
  </div>
</div>

<div class="container">

  <!-- Together Since -->
  <div class="card">
    <div class="together-label">💜 在一起纪念日</div>
    <div class="together-date">2025 年 12 月 12 日</div>
    <div class="timer-row">
      <div class="timer-unit">
        <div class="timer-num" id="t-days">0</div>
        <div class="timer-label">天</div>
      </div>
      <div class="timer-unit">
        <div class="timer-num" id="t-hours">00</div>
        <div class="timer-label">时</div>
      </div>
      <div class="timer-unit">
        <div class="timer-num" id="t-mins">00</div>
        <div class="timer-label">分</div>
      </div>
      <div class="timer-unit">
        <div class="timer-num" id="t-secs">00</div>
        <div class="timer-label">秒</div>
      </div>
    </div>
  </div>



  <!-- Last Seen Timer -->
  <div class="card">
    <div class="together-label">🐾 距离上一次见面已过去</div>
    <div class="together-date" style="margin-bottom:12px;">上次见面：2026 年 5 月 5 日</div>
    <div class="timer-row">
      <div class="timer-unit" style="border-color:rgba(147,197,253,0.4);">
        <div class="timer-num" id="ls-days" style="color:#1D4ED8;">0</div>
        <div class="timer-label" style="color:#3B82F6;">天</div>
      </div>
      <div class="timer-unit" style="border-color:rgba(147,197,253,0.4);">
        <div class="timer-num" id="ls-hours" style="color:#1D4ED8;">00</div>
        <div class="timer-label" style="color:#3B82F6;">时</div>
      </div>
      <div class="timer-unit" style="border-color:rgba(147,197,253,0.4);">
        <div class="timer-num" id="ls-mins" style="color:#1D4ED8;">00</div>
        <div class="timer-label" style="color:#3B82F6;">分</div>
      </div>
      <div class="timer-unit" style="border-color:rgba(147,197,253,0.4);">
        <div class="timer-num" id="ls-secs" style="color:#1D4ED8;">00</div>
        <div class="timer-label" style="color:#3B82F6;">秒</div>
      </div>
    </div>
  </div>


  <!-- Weather Row -->
  <div class="weather-row">
    <div class="weather-card">
      <div class="weather-city">🌸 小白在这里</div>
      <div class="weather-place">沈阳·浑南区</div>
    </div>
    <div class="weather-card">
      <div class="weather-city">🐾 小黄在这里</div>
      <div class="weather-place">广州·南沙区</div>
    </div>
  </div>

  <!-- Gauge Card -->
  <div class="card gauge-section">
    <svg width="0" height="0" style="position:absolute">
      <defs>
        <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" style="stop-color:#C4B5FD"/>
          <stop offset="50%" style="stop-color:#A78BFA"/>
          <stop offset="100%" style="stop-color:#7C3AED"/>
        </linearGradient>
      </defs>
    </svg>
    <div class="gauge-wrap">
      <svg class="gauge-svg-ring" viewBox="0 0 210 210">
        <circle class="gauge-track" cx="105" cy="105" r="85"/>
        <circle class="gauge-fill" id="gaugeFill" cx="105" cy="105" r="85"/>
      </svg>
      <div class="gauge-character">
        <div class="char-img-wrap">
          <img id="charImg" src="" alt="小黄小白">
        </div>
      </div>
    </div>
    <span class="gauge-pct" id="gaugePct">0%</span>
    <div class="gauge-status" id="gaugeStatus">还好还好～</div>
  </div>

  <!-- Hearts -->
  <div class="card">
    <div class="hearts-title">💜 相处以来积累的思念心心</div>
    <div class="hearts-count-display">
      <div class="hearts-big-num" id="heartCount">0</div>
      <div class="hearts-sub">每过一秒，就多一颗 💜</div>
    </div>
    <div id="heartField"></div>
  </div>

  <!-- Buttons -->
  <div class="btn-grid">
    <button class="btn" onclick="addMiss(5,'又想了一下','💭',event)">
      💭 又想了一下<small>+5%</small>
    </button>
    <button class="btn btn-special" onclick="addMiss(15,'她发消息了！','💌',event)">
      💌 她发消息了<small>+15%</small>
    </button>
    <button class="btn btn-special" onclick="addMiss(20,'梦到她了🌙','🌙',event)">
      🌙 梦到她了！<small>+20%</small>
    </button>
    <button class="btn btn-special" onclick="addMiss(10,'想分享给她','🌈',event)">
      🌈 想分享给她<small>+10%</small>
    </button>
    <button class="btn btn-clear btn-full" onclick="seenHer(event)">
      🌸 见到她了！— 归零重来～
    </button>
  </div>

  <!-- Log -->
  <div class="card">
    <div class="log-title">📋 今日记录</div>
    <ul class="log-list" id="logList">
      <li class="log-empty">还没有记录哦～</li>
    </ul>
  </div>

</div>

  document.getElementById('heroPhoto').src = 'data:image/jpeg;base64,' + IMG2_B64;
  document.getElementById('charImg').src = 'data:image/jpeg;base64,' + IMG1_B64;

  // ===== STATE =====
  let missValue = parseInt(localStorage.getItem('missValue') || '0');
  let heartCount = parseInt(localStorage.getItem('heartCount') || '0');
  let logs = JSON.parse(localStorage.getItem('logs') || '[]');
  const startDate = new Date('2025-12-12T00:00:00');
  const C = 2 * Math.PI * 85; // ~534

  function save() {
    localStorage.setItem('missValue', missValue);
    localStorage.setItem('heartCount', heartCount);
    localStorage.setItem('logs', JSON.stringify(logs));
  }

  function updateGauge() {
    const pct = Math.min(100, Math.max(0, missValue));
    const offset = C - (C * pct / 100);
    document.getElementById('gaugeFill').style.strokeDashoffset = offset;
    document.getElementById('gaugePct').textContent = pct + '%';
    let status = '还好还好～ ☁️';
    if (pct > 85) status = '快撑不住了！！💜';
    else if (pct > 60) status = '好想好想她呀～ 💕';
    else if (pct > 30) status = '有点想她了呢～ 🌸';
    document.getElementById('gaugeStatus').textContent = status;
  }

  function updateHearts() {
    const field = document.getElementById('heartField');
    document.getElementById('heartCount').textContent = heartCount;
    const maxShow = 200;
    const shown = Math.min(heartCount, maxShow);
    field.innerHTML = '';
    for (let i = 0; i < shown; i++) {
      const span = document.createElement('span');
      span.className = 'heart-item';
      span.textContent = '💜';
      span.style.animationDelay = (i * 0.004) + 's';
      field.appendChild(span);
    }
    if (heartCount > maxShow) {
      const more = document.createElement('span');
      more.style.cssText = 'font-size:0.68rem;color:#A78BFA;font-weight:700;align-self:center;padding:2px 4px;';
      more.textContent = `…还有${heartCount - maxShow}颗💜`;
      field.appendChild(more);
    }
    setTimeout(() => { field.scrollTop = field.scrollHeight; }, 50);
  }

  function renderLogs() {
    const list = document.getElementById('logList');
    if (!logs.length) {
      list.innerHTML = '<li class="log-empty">还没有记录哦～</li>';
      return;
    }
    list.innerHTML = '';
    logs.slice(-10).reverse().forEach(log => {
      const li = document.createElement('li');
      li.className = 'log-item';
      li.innerHTML = `<span class="log-icon">${log.icon}</span><span class="log-text">${log.text}</span><span class="log-time">${log.time}</span>`;
      list.appendChild(li);
    });
  }

  function addLog(text, icon) {
    const now = new Date();
    const time = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
    logs.push({ text, icon, time });
    if (logs.length > 50) logs = logs.slice(-50);
    renderLogs();
  }

  function spawnHearts(x, y, count = 6) {
    for (let i = 0; i < count; i++) {
      const el = document.createElement('div');
      el.className = 'float-heart';
      el.textContent = '💜';
      el.style.left = (x + (Math.random() - 0.5) * 80) + 'px';
      el.style.top = (y + (Math.random() - 0.5) * 40) + 'px';
      el.style.animationDelay = (Math.random() * 0.25) + 's';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2000);
    }
  }

  function spawnFireworks() {
    const emojis = ['🌸','✨','💜','🎀','💕','⭐','🌟','💖','🫧'];
    for (let i = 0; i < 14; i++) {
      const el = document.createElement('div');
      el.className = 'firework';
      el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      el.style.left = (8 + Math.random() * 84) + 'vw';
      el.style.top = (8 + Math.random() * 75) + 'vh';
      el.style.animationDelay = (Math.random() * 0.7) + 's';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1800);
    }
  }

  function addMiss(amount, label, icon, e) {
    missValue = Math.min(100, missValue + amount);
    save(); updateGauge(); addLog(label + ` (+${amount}%)`, icon);
    const rect = e.currentTarget.getBoundingClientRect();
    spawnHearts(rect.left + rect.width / 2, rect.top + rect.height / 2, 7);
  }

  function seenHer(e) {
    missValue = 0;
    save(); updateGauge(); addLog('见到小白啦～ 清零重新开始！', '🌸');
    spawnFireworks();
  }

  function updateTimer() {
    const diff = Math.max(0, Date.now() - startDate.getTime());
    const s = Math.floor(diff/1000)%60, m = Math.floor(diff/60000)%60,
          h = Math.floor(diff/3600000)%24, d = Math.floor(diff/86400000);
    document.getElementById('t-days').textContent = d;
    document.getElementById('t-hours').textContent = h.toString().padStart(2,'0');
    document.getElementById('t-mins').textContent = m.toString().padStart(2,'0');
    document.getElementById('t-secs').textContent = s.toString().padStart(2,'0');
  }

  function tickHeart() {
    heartCount++;
    save();
    updateHearts();
  }

  function autoDecay() {
    if (missValue > 0) { missValue = Math.max(0, missValue - 2); save(); updateGauge(); }
  }


  const lastSeenDate = new Date('2026-05-05T00:00:00');

  function updateLastSeenTimer() {
    const diff = Math.max(0, Date.now() - lastSeenDate.getTime());
    const s = Math.floor(diff/1000)%60, m = Math.floor(diff/60000)%60,
          h = Math.floor(diff/3600000)%24, d = Math.floor(diff/86400000);
    document.getElementById('ls-days').textContent = d;
    document.getElementById('ls-hours').textContent = h.toString().padStart(2,'0');
    document.getElementById('ls-mins').textContent = m.toString().padStart(2,'0');
    document.getElementById('ls-secs').textContent = s.toString().padStart(2,'0');
  }

  updateGauge(); updateHearts(); renderLogs(); updateTimer(); updateLastSeenTimer();
  setInterval(updateTimer, 1000);
  setInterval(updateLastSeenTimer, 1000);
  setInterval(tickHeart, 1000);
  setInterval(autoDecay, 3600000);
</script>
